name: Deploy Documentation to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build & Verify Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - name: Configure private repository access
        env:
          TOKEN: ${{ secrets.SENSE_THE_GAME_REPO_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            git config --global \
              url."https://x-access-token:${TOKEN}@github.com/IPOleksenko/SENSE-The-Game".insteadOf \
              "https://github.com/IPOleksenko/SENSE-The-Game"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: 'npm'

      - name: Setup Rust WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src
          targets: wasm32-unknown-unknown

      - name: Install emulator build tools
        run: sudo apt-get update && sudo apt-get install -y clang make nasm gcc-multilib g++-multilib default-jre-headless

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Cache Build Repositories & Artifacts
        uses: actions/cache@v4
        with:
          path: .cache
          key: ${{ runner.os }}-ipo-cache-${{ hashFiles('.gitmodules', 'scripts/build-artifacts.py', 'scripts/prepare-v86.mjs', 'scripts/project_repositories.py', 'patches/v86-mtrr.patch') }}
          restore-keys: |
            ${{ runner.os }}-ipo-cache-

      - name: Build Astro Site & Search Index
        run: npm run build
        env:
          BASE_URL: '/${{ github.event.repository.name }}/'

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
