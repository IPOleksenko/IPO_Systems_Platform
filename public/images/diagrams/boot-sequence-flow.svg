  <rect width="920" height="620" fill="url(#bg)" rx="12"/>
  <text x="460" y="38" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">Full Bare-Metal Boot Sequence &amp; Timing Pipeline</text>

  <!-- Step 1 -->
