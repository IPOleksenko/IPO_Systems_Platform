    <text x="12" y="44" font-family="monospace" font-size="11" fill="#f8fafc">i440FX / Q35 PCI Probing</text>
    <text x="12" y="58" font-family="sans-serif" font-size="11" fill="#a7f3d0">DRAM Pattern: 0x55AA55AA</text>
