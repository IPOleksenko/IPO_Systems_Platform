    <text x="260" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fef3c7" text-anchor="middle">IPO_OS OPERATIONAL STATE</text>
    <text x="260" y="50" font-family="system-ui, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">IPO_FS Mounted at LBA 2048 • RTL8139 TCP/IP Ready • Audio Startup Chord (C6-E6-G6-C7)</text>
    <text x="260" y="70" font-family="monospace" font-size="11" fill="#fde68a" text-anchor="middle">Interactive Shell / GUI WM Running • Apps loaded at 0x800000</text>
