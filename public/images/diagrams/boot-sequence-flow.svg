  <!-- Downward Arrow -->
  <path d="M 755 426 L 755 466 L 460 466 L 460 496" stroke="#f59e0b" stroke-width="2" fill="none"/>
  <polygon points="456,496 460,504 464,496" fill="#f59e0b"/>

