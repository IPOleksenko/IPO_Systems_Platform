    <text x="12" y="44" font-family="monospace" font-size="11" fill="#f8fafc">MTRR NEM Configuration</text>
    <text x="12" y="58" font-family="sans-serif" font-size="11" fill="#a7f3d0">Stack at 0x7000:8000</text>
