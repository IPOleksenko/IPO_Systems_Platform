    <text x="12" y="44" font-family="monospace" font-size="11" fill="#f8fafc">IVT INT 10h-1Ah • BDA 0x400</text>
    <text x="12" y="58" font-family="sans-serif" font-size="11" fill="#ddd6fe">Fast A20 Gate Port 0x92</text>
  </g>

  <!-- Arrow -->
  <path d="M 590 243 L 630 243" stroke="#8b5cf6" stroke-width="2"/>
  <polygon points="630,239 638,243 630,247" fill="#8b5cf6"/>

