<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="880" height="540" fill="url(#bgSc)" rx="12"/>
  <text x="440" y="38" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">IPO_OS System Call Calling Convention &amp; Ring Switch</text>
  <text x="440" y="60" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Software interrupt INT 0x80 ABI and Kernel Dispatch Pipeline</text>

  <!-- User Space Box -->
  <g transform="translate(60, 90)">
    <rect width="760" height="110" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="24" y="30" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#fcd34d">USERSPACE (Ring 3) — Caller Setup</text>
    <text x="24" y="55" font-family="monospace" font-size="12" fill="#f8fafc">int ipo_syscall(uint32_t num, uint32_t argc, uint32_t *argv);</text>
    
    <g transform="translate(24, 70)">
      <rect width="180" height="26" rx="4" fill="#78350f"/>
      <text x="90" y="17" font-family="monospace" font-size="11.5" font-weight="700" fill="#fef3c7" text-anchor="middle">EAX = Syscall Number</text>

      <rect x="200" width="180" height="26" rx="4" fill="#78350f"/>
      <text x="290" y="17" font-family="monospace" font-size="11.5" font-weight="700" fill="#fef3c7" text-anchor="middle">EBX = Argument Count</text>

      <rect x="400" width="220" height="26" rx="4" fill="#78350f"/>
      <text x="510" y="17" font-family="monospace" font-size="11.5" font-weight="700" fill="#fef3c7" text-anchor="middle">ECX = Pointer to argv array</text>
    </g>
  </g>

  <!-- Transition -->
  <path d="M 440 200 L 440 260" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4,4"/>
  <polygon points="435,260 440,270 445,260" fill="#f59e0b"/>
  <rect x="330" y="220" width="220" height="24" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
  <text x="440" y="236" font-family="monospace" font-size="11" font-weight="700" fill="#fef3c7" text-anchor="middle">INT 0x80 (IDT DPL=3 Gate)</text>

  <!-- Kernel Space Box -->
  <g transform="translate(60, 270)">
    <rect width="760" height="220" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="24" y="30" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#60a5fa">KERNEL SPACE (Ring 0) — Dispatcher &amp; Execution</text>
    <text x="24" y="55" font-family="monospace" font-size="11.5" fill="#bfdbfe">syscall_isr_entry() in syscall.asm -&gt; ipo_syscall() in syscall.c</text>

    <!-- Subsystems Grid -->
    <g transform="translate(24, 75)">
      <rect width="160" height="55" rx="4" fill="#1e3a8a"/>
      <text x="80" y="24" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">VFS / Storage</text>
      <text x="80" y="42" font-family="monospace" font-size="9.5" fill="#93c5fd" text-anchor="middle">0x1010 .. 0x1019</text>

      <rect x="180" width="160" height="55" rx="4" fill="#1e3a8a"/>
      <text x="260" y="24" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Process / Memory</text>
      <text x="260" y="42" font-family="monospace" font-size="9.5" fill="#93c5fd" text-anchor="middle">0x1020, 0x1045 (sbrk)</text>

      <rect x="360" width="160" height="55" rx="4" fill="#1e3a8a"/>
      <text x="440" y="24" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Shared Vars / IPC</text>
      <text x="440" y="42" font-family="monospace" font-size="9.5" fill="#93c5fd" text-anchor="middle">0x1042 .. 0x1044</text>

      <rect x="540" width="160" height="55" rx="4" fill="#1e3a8a"/>
      <text x="620" y="24" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">GUI Window Mgr</text>
      <text x="620" y="42" font-family="monospace" font-size="9.5" fill="#93c5fd" text-anchor="middle">0x1070 .. 0x107F</text>
    </g>

    <rect x="24" y="150" width="712" height="40" rx="4" fill="#0f172a" stroke="#22c55e" stroke-width="1"/>
    <text x="380" y="175" font-family="monospace" font-size="11.5" font-weight="700" fill="#4ade80" text-anchor="middle">Return Value placed in EAX -&gt; CPU executes 'iret' -&gt; Return to User Code</text>
  </g>
</svg>