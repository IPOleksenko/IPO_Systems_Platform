<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSched" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="860" height="480" fill="url(#bgSched)" rx="12"/>
  <text x="430" y="38" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">IPO_OS Process Lifecycle &amp; Task Scheduler FSM</text>
  <text x="430" y="60" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Round-Robin scheduling • Foreground / Background swapping • VRAM preservation</text>

  <!-- State: CREATED -->
  <g transform="translate(60, 180)">
    <circle cx="50" cy="50" r="48" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/>
    <text x="50" y="48" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">EMBRYO</text>
    <text x="50" y="64" font-family="monospace" font-size="9" fill="#93c5fd" text-anchor="middle">ELF Loaded</text>
  </g>

  <!-- Arrow -->
  <path d="M 160 230 L 230 230" stroke="#3b82f6" stroke-width="2"/>
  <polygon points="230,226 238,230 230,234" fill="#3b82f6"/>

  <!-- State: RUNNING -->
  <g transform="translate(240, 180)">
    <circle cx="50" cy="50" r="48" fill="#065f46" stroke="#10b981" stroke-width="2"/>
    <text x="50" y="48" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">RUNNING</text>
    <text x="50" y="64" font-family="monospace" font-size="9" fill="#6ee7b7" text-anchor="middle">Active CPU</text>
  </g>

  <!-- Loop: Yield / Quantum -->
  <path d="M 280 180 C 280 120, 300 120, 300 180" stroke="#10b981" stroke-width="2" fill="none"/>
  <text x="290" y="105" font-family="sans-serif" font-size="10.5" fill="#a7f3d0" text-anchor="middle">PIT Timer Tick / Yield (0x1023)</text>

  <!-- Arrow to Swapped / Waiting -->
  <path d="M 340 230 L 440 230" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="440,226 448,230 440,234" fill="#f59e0b"/>

  <!-- State: WAITING / SWAPPED -->
  <g transform="translate(450, 180)">
    <circle cx="50" cy="50" r="48" fill="#78350f" stroke="#f59e0b" stroke-width="2"/>
    <text x="50" y="44" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">BLOCKED /</text>
    <text x="50" y="60" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">SWAPPED</text>
    <text x="50" y="74" font-family="monospace" font-size="8.5" fill="#fde68a" text-anchor="middle">VRAM Backup</text>
  </g>

  <!-- Arrow Back -->
  <path d="M 450 245 C 390 280, 370 280, 335 245" stroke="#f59e0b" stroke-width="2" fill="none"/>
  <text x="390" y="295" font-family="sans-serif" font-size="10" fill="#fde68a" text-anchor="middle">Input Ready / Switch FG</text>

  <!-- Arrow to Terminated -->
  <path d="M 290 280 L 290 380 L 620 380 L 620 280" stroke="#ef4444" stroke-width="2" fill="none"/>
  <polygon points="616,280 620,272 624,280" fill="#ef4444"/>
  <text x="450" y="372" font-family="monospace" font-size="10" fill="#fca5a5" text-anchor="middle">IPO_SYSCALL_EXIT (0xFFFF) / Exception (#GP, #PF)</text>

  <!-- State: TERMINATED -->
  <g transform="translate(620, 180)">
    <circle cx="50" cy="50" r="48" fill="#7f1d1d" stroke="#ef4444" stroke-width="2"/>
    <text x="50" y="48" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">ZOMBIE /</text>
    <text x="50" y="64" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">EXITED</text>
  </g>
</svg>