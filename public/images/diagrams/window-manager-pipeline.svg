<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgWm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="880" height="500" fill="url(#bgWm)" rx="12"/>
  <text x="440" y="38" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">Dynamic Display, RGBA64F HDR, WM &amp; VirGL 3D Pipeline</text>
  <text x="440" y="60" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Dynamic terminal-matched resolution, BGA/VirtIO-GPU 2D/VirGL 3D &amp; WM compositing</text>

  <!-- Left: Text Console & Fonts -->
  <g transform="translate(60, 90)">
    <rect width="360" height="360" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="180" y="32" font-family="sans-serif" font-size="14" font-weight="700" fill="#60a5fa" text-anchor="middle">DYNAMIC HARDWARE TEXT CONSOLE</text>
    
    <g transform="translate(20, 50)">
      <rect width="320" height="60" rx="4" fill="#0f172a" stroke="#475569"/>
      <text x="10" y="24" font-family="sans-serif" font-size="11" font-weight="700" fill="#93c5fd">VRAM 0xB8000 (Hardware Bounds via 0x1065)</text>
      <text x="10" y="44" font-family="monospace" font-size="10" fill="#cbd5e1">CRTC/BDA dims • Scrollback &amp; Heap Cursor Glyphs</text>

      <rect y="75" width="320" height="110" rx="4" fill="#022c22" stroke="#10b981"/>
      <text x="10" y="98" font-family="sans-serif" font-size="11" font-weight="700" fill="#34d399">UTF-8 IFNT Fonts &amp; Keymaps</text>
      <text x="10" y="118" font-family="sans-serif" font-size="10" fill="#a7f3d0">• fixed / terminus / bold (.fnt) in VGA/Framebuffer</text>
      <text x="10" y="136" font-family="sans-serif" font-size="10" fill="#a7f3d0">• ASCII, Cyrillic &amp; Hanzi glyph rendering</text>
      <text x="10" y="154" font-family="sans-serif" font-size="10" fill="#a7f3d0">• Layouts: EN, RU, UA, ZH (Alt/Ctrl+Shift)</text>

      <rect y="200" width="320" height="85" rx="4" fill="#1e1e38" stroke="#8b5cf6"/>
      <text x="10" y="224" font-family="sans-serif" font-size="11" font-weight="700" fill="#c084fc">Workspace &amp; Buffer Isolation</text>
      <text x="10" y="244" font-family="sans-serif" font-size="10" fill="#ddd6fe">Per-process heap text &amp; graphics backup</text>
      <text x="10" y="262" font-family="sans-serif" font-size="10" fill="#ddd6fe">Unbounded scrollback &amp; foreground switch</text>
    </g>
  </g>

  <!-- Right: LFB, RGBA64F, WM & VirGL 3D -->
  <g transform="translate(460, 90)">
    <rect width="360" height="360" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="180" y="32" font-family="sans-serif" font-size="14" font-weight="700" fill="#fcd34d" text-anchor="middle">WM, IPO_GFX &amp; VIRGL 3D GPU</text>
    
    <g transform="translate(20, 50)">
      <rect width="320" height="60" rx="4" fill="#0f172a" stroke="#475569"/>
      <text x="10" y="24" font-family="sans-serif" font-size="11" font-weight="700" fill="#fde68a">LFB: BGA / VirtIO-GPU / VGA (Mode 13h Fallback)</text>
      <text x="10" y="44" font-family="monospace" font-size="10" fill="#cbd5e1">Arbitrary Res • RGBA64F HDR &amp; Dither (0x11E0..EA)</text>

      <rect y="75" width="320" height="110" rx="4" fill="#3b0764" stroke="#c084fc"/>
      <text x="10" y="98" font-family="sans-serif" font-size="11" font-weight="700" fill="#e879f9">Window Manager Compositor</text>
      <text x="10" y="118" font-family="sans-serif" font-size="10" fill="#f5d0fe">• Defaults to exact terminal pixel size on startwm</text>
      <text x="10" y="136" font-family="sans-serif" font-size="10" fill="#f5d0fe">• wm_poll_event(), Z-order &amp; shaped masks</text>
      <text x="10" y="154" font-family="sans-serif" font-size="10" fill="#f5d0fe">• Pixel cursor scaling (cursor WxH / auto)</text>

      <rect y="200" width="320" height="85" rx="4" fill="#451a03" stroke="#f59e0b"/>
      <text x="10" y="224" font-family="sans-serif" font-size="11" font-weight="700" fill="#fcd34d">Hardware 3D &amp; CPU Fallback</text>
      <text x="10" y="244" font-family="sans-serif" font-size="10" fill="#fef3c7">VirtIO-GPU VirGL 3D (0x11F0..F7) &amp; ipo_gfx3d</text>
      <text x="10" y="262" font-family="sans-serif" font-size="10" fill="#fef3c7">gl_cube, gl_gears, gl_teapot, gpu_info, doom</text>
    </g>
  </g>
</svg>