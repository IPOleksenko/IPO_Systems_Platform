<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bgM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <rect width="880" height="720" fill="url(#bgM)" rx="12"/>
  <text x="440" y="38" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">x86 Physical &amp; Virtual Memory Map Specification</text>
  <text x="440" y="60" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Complete 4 GB linear address space organization and region reservation</text>

  <!-- Bar container -->
  <g transform="translate(60, 90)">
    <!-- 0xFFFFFFFF Reset Vector -->
    <rect x="0" y="0" width="160" height="36" fill="#dc2626" rx="4"/>
    <text x="175" y="22" font-family="monospace" font-size="12" font-weight="700" fill="#fca5a5">0xFFFFFFF0 - 0xFFFFFFFF</text>
    <text x="430" y="22" font-family="system-ui, sans-serif" font-size="12" fill="#f8fafc">Hardware Reset Vector (16B) &amp; SPI Flash Aliased Top</text>

    <!-- 0xD0000000 / 0xC0000000 High System & SHM -->
    <rect x="0" y="44" width="160" height="44" fill="#b45309" rx="4"/>
    <text x="175" y="63" font-family="monospace" font-size="12" font-weight="700" fill="#fcd34d">0xC0000000 - 0xFFFFFFFF</text>
    <text x="430" y="63" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Trampolines, IPC SHM (0xD0000000+) &amp; PCI MMIO</text>

    <!-- 0x10000000 User Heaps -->
    <rect x="0" y="96" width="160" height="58" fill="#d97706" rx="4"/>
    <text x="175" y="121" font-family="monospace" font-size="12" font-weight="700" fill="#fcd34d">0x10000000 - 0xBFFFFFFF</text>
    <text x="430" y="118" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Isolated User Process Heaps &amp; mmap() / sbrk()</text>
    <text x="430" y="136" font-family="system-ui, sans-serif" font-size="11.5" fill="#fde68a">USER_HEAP_START = 256 MiB (0x09000000 if RAM &lt;= 256 MiB) • 256 MiB stride</text>

    <!-- 0x04000000 - 0x0FFFFFFF Kernel kmalloc + PMM -->
    <rect x="0" y="162" width="160" height="60" fill="#2563eb" rx="4"/>
    <text x="175" y="187" font-family="monospace" font-size="12" font-weight="700" fill="#93c5fd">0x04000000 - 0x0FFFFFFF</text>
    <text x="430" y="185" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Kernel kmalloc Heap (64 MiB + Overflow) &amp; PMM Frames (0x08000000+)</text>
    <text x="430" y="203" font-family="system-ui, sans-serif" font-size="11.5" fill="#bfdbfe">Self-expanding overflow arenas • PML4 / LA57 page tables • Storage &amp; IPC buffers</text>

    <!-- 0x00100000 - 0x03FFFFFF Kernel + Apps -->
    <rect x="0" y="230" width="160" height="54" fill="#1d4ed8" rx="4"/>
    <text x="175" y="253" font-family="monospace" font-size="12" font-weight="700" fill="#93c5fd">0x00100000 - 0x03FFFFFF</text>
    <text x="430" y="251" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">IPO_OS Kernel (1 MiB), SB16 DMA (0x600000), User Apps (0x800000+)</text>
    <text x="430" y="269" font-family="system-ui, sans-serif" font-size="11.5" fill="#bfdbfe">entry.asm • kmain() at 0x100000 • IDT/GDT/SMP • ELF/Flat Exec (0x800000)</text>

    <!-- 0x000F0000 - 0x000FFFFF Shadow RAM -->
    <rect x="0" y="292" width="160" height="38" fill="#7c3aed" rx="4"/>
    <text x="175" y="315" font-family="monospace" font-size="12" font-weight="700" fill="#c4b5fd">0x000F0000 - 0x000FFFFF</text>
    <text x="430" y="315" font-family="system-ui, sans-serif" font-size="12" fill="#f8fafc">Firmware (0xF000:000C) + 8 KiB Bootblock (0xFE000..0xFFFFF)</text>

    <!-- 0x000C0000 - 0x000EFFFF VBIOS & Option ROMs -->
    <rect x="0" y="338" width="160" height="38" fill="#6d28d9" rx="4"/>
    <text x="175" y="361" font-family="monospace" font-size="12" font-weight="700" fill="#c4b5fd">0x000C0000 - 0x000EFFFF</text>
    <text x="430" y="361" font-family="system-ui, sans-serif" font-size="12" fill="#f8fafc">Video BIOS (VBIOS) &amp; Expansion Option ROMs</text>

    <!-- 0x000A0000 - 0x000BFFFF VGA VRAM -->
    <rect x="0" y="384" width="160" height="50" fill="#059669" rx="4"/>
    <text x="175" y="413" font-family="monospace" font-size="12" font-weight="700" fill="#6ee7b7">0x000A0000 - 0x000BFFFF</text>
    <text x="430" y="405" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">VGA Video Buffers</text>
    <text x="430" y="423" font-family="system-ui, sans-serif" font-size="11.5" fill="#a7f3d0">0xB8000: Dynamic Text Mode • 0xA0000: Graphics Aperture</text>

    <!-- 0x0009FC00 EBDA -->
    <rect x="0" y="442" width="160" height="32" fill="#475569" rx="4"/>
    <text x="175" y="462" font-family="monospace" font-size="12" font-weight="700" fill="#cbd5e1">0x0009FC00 - 0x0009FFFF</text>
    <text x="430" y="462" font-family="system-ui, sans-serif" font-size="12" fill="#f8fafc">EBDA &amp; ACPI 1.0 RSDP (Tables in SCRATCH_ACPI_BASE below TOLUD)</text>

    <!-- 0x00070000 Boot ROM CAR -->
    <rect x="0" y="482" width="160" height="52" fill="#1e40af" rx="4"/>
    <text x="175" y="512" font-family="monospace" font-size="12" font-weight="700" fill="#93c5fd">0x00070000 - 0x00077FFF</text>
    <text x="430" y="504" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Boot ROM Cache-as-RAM (32 KiB CAR Window)</text>
    <text x="430" y="522" font-family="system-ui, sans-serif" font-size="11.5" fill="#bfdbfe">Pre-DRAM stack &amp; XIP C romstage scratchpad (torn down before 0xF000:000C)</text>

    <!-- 0x00006000 - 0x00008FFF Handover & SMP -->
    <rect x="0" y="542" width="160" height="30" fill="#047857" rx="4"/>
    <text x="175" y="561" font-family="monospace" font-size="12" font-weight="700" fill="#6ee7b7">0x00006000 - 0x00008FFF</text>
    <text x="430" y="561" font-family="system-ui, sans-serif" font-size="12" fill="#f8fafc">E820 Map (0x6000), MBR (0x7C00), SMP Trampoline (0x8000..0x81AF)</text>

    <!-- 0x00000500 Scratch RAM -->
    <rect x="0" y="580" width="160" height="26" fill="#334155" rx="4"/>
    <text x="175" y="597" font-family="monospace" font-size="12" font-weight="700" fill="#94a3b8">0x00000500 - 0x00007BFF</text>
    <text x="430" y="597" font-family="system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">Conventional Scratch RAM &amp; Real-Mode Stacks</text>

    <!-- 0x00000400 BDA -->
    <rect x="0" y="614" width="160" height="20" fill="#475569" rx="4"/>
    <text x="175" y="628" font-family="monospace" font-size="12" font-weight="700" fill="#94a3b8">0x00000400 - 0x000004FF</text>
    <text x="430" y="628" font-family="system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">BIOS Data Area (BDA, 256 bytes): cursor pos, tick counter (0x6C)</text>

    <!-- 0x00000000 IVT -->
    <rect x="0" y="642" width="160" height="26" fill="#64748b" rx="4"/>
    <text x="175" y="658" font-family="monospace" font-size="12" font-weight="700" fill="#94a3b8">0x00000000 - 0x000003FF</text>
    <text x="430" y="658" font-family="system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">Interrupt Vector Table (IVT, 1024 bytes, 256 real-mode far pointers)</text>
  </g>
</svg>